plugins {
    id 'com.android.application'
}

android {
    namespace 'com.godhand.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.godhand.app"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }
}
