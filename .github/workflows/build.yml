name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and Package Android Application
        run: |
          # Criar uma estrutura de projeto Gradle mínima e válida diretamente no runner
          mkdir -p app/src/main/java/com/godhand/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/jniLibs/arm64-v8a

          # 1. AndroidManifest.xml
          cat << 'ENDXML' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.godhand.app"
              android:versionCode="1"
              android:versionName="1.0">
              <application
                  android:label="God Hand Port"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDXML

          # 2. MainActivity.java
          cat << 'ENDJAVA' > app/src/main/java/com/godhand/app/MainActivity.java
          package com.godhand.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          import android.graphics.Color;
          import android.view.Gravity;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("God Hand Android Port - Motor Ativo");
                  tv.setTextColor(Color.WHITE);
                  tv.setTextSize(18);
                  tv.setGravity(Gravity.CENTER);
                  tv.setBackgroundColor(Color.BLACK);
                  setContentView(tv);
              }
          }
          ENDJAVA

          # 3. Ficheiros de configuração do Gradle
          cat << 'ENDGRADLE' > build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ENDGRADLE

          cat << 'ENDSETTINGS' > settings.gradle
          include ':app'
          ENDSETTINGS

          cat << 'ENDAPPGRADLE' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.godhand.app'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.godhand.app'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          ENDAPPGRADLE

          cat << 'ENDPROPS' > local.properties
          sdk.dir=$ANDROID_SDK_ROOT
          ENDPROPS

          # Adicionar wrapper do Gradle
          gradle wrapper

          # Compilar o APK de Debug real via Gradle
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-APK
          path: app/build/outputs/apk/debug/app-debug.apk
