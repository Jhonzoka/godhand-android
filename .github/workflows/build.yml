name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Valid APK
        run: |
          # 1. Compilar C++ nativo
          mkdir -p app/src/main/cpp
          cat << 'ENDCPP' > app/src/main/cpp/main.cpp
          #include <jni.h>
          extern "C" JNIEXPORT jstring JNICALL
          Java_com_godhand_app_MainActivity_stringFromJNI(JNIEnv* env, jobject thiz) {
              return env->NewStringUTF("God Hand Android - Executando!");
          }
          ENDCPP

          # 2. Compilar com Gradle Wrapper gerado dinamicamente
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-APK
          path: app/build/outputs/apk/debug/app-debug.apk
