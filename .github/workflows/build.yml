name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Valid Android APK
        run: |
          # 1. Preparar estrutura da app
          mkdir -p src/com/godhand/app
          mkdir -p apk_structure/lib/arm64-v8a

          # 2. Criar código da MainActivity em Java
          cat << 'ENDJAVA' > src/com/godhand/app/MainActivity.java
          package com.godhand.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("God Hand Android Port - Instalado com Sucesso!");
                  tv.setTextSize(20);
                  tv.setPadding(40, 100, 40, 40);
                  setContentView(tv);
              }
          }
          ENDJAVA

          # 3. Compilar Java e gerar classes.dex usando a Android Build-Tools oficial
          ANDROID_JAR=$ANDROID_HOME/platforms/android-33/android.jar
          BUILD_TOOLS=$ANDROID_HOME/build-tools/33.0.2

          mkdir -p bin/classes
          javac -cp $ANDROID_JAR -d bin/classes src/com/godhand/app/MainActivity.java
          $BUILD_TOOLS/d8 bin/classes/com/godhand/app/*.class --output apk_structure/

          # 4. Criar AndroidManifest.xml compilado e empacotar
          cat << 'ENDMANIFEST' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.godhand.app" android:versionCode="1" android:versionName="1.0">
              <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />
              <application android:label="God Hand" android:hasCode="true">
                  <activity android:name="com.godhand.app.MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ENDMANIFEST

          $BUILD_TOOLS/aapt package -f -M AndroidManifest.xml -I $ANDROID_JAR -S app/src/main/res/ -F unaligned.apk apk_structure/
          $BUILD_TOOLS/zipalign -v 4 unaligned.apk app-debug-unsigned.apk

          # 5. Assinar o APK para o Android permitir a instalação
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android app-debug-unsigned.apk

          # 6. Mover para a pasta de artefatos
          mkdir -p app/build/outputs/apk/debug/
          mv app-debug-unsigned.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-APK
          path: app/build/outputs/apk/debug/app-debug.apk
