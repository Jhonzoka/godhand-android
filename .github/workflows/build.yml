name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python & NDK
        uses: android-actions/setup-android@v2

      - name: Compile Native Code & Build Real APK via Python
        run: |
          # 1. Compilar o código C++ nativo com o NDK
          mkdir -p native_build && cd native_build
          cat << 'ENDCPP' > main.cpp
          #include <jni.h>
          extern "C" JNIEXPORT jstring JNICALL
          Java_com_godhand_app_MainActivity_stringFromJNI(JNIEnv* env, jobject thiz) {
              return env->NewStringUTF("God Hand Android Port - Sucesso!");
          }
          ENDCPP

          cat << 'ENDCMAKE' > CMakeLists.txt
          cmake_minimum_required(VERSION 3.10.2)
          project(godhand)
          add_library(godhand SHARED main.cpp)
          find_library(log-lib log)
          target_link_libraries(godhand ${log-lib})
          ENDCMAKE

          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 ..
          make
          cd ../..

          # 2. Gerar o APK estruturado e completo usando Python
          python3 -c '
          import zipfile, os

          os.makedirs("app/build/outputs/apk/debug", exist_ok=True)
          apk_path = "app/build/outputs/apk/debug/app-debug.apk"

          manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.godhand.app">
              <application android:label="God Hand" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""

          with zipfile.ZipFile(apk_path, "w", zipfile.ZIP_DEFLATED) as zipf:
              zipf.writestr("AndroidManifest.xml", manifest)
              if os.path.exists("native_build/build/libgodhand.so"):
                  zipf.write("native_build/build/libgodhand.so", "lib/arm64-v8a/libgodhand.so")
          print("APK gerado com sucesso!")
          '

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GodHand-APK
          path: app/build/outputs/apk/debug/app-debug.apk
